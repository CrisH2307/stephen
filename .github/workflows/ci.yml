name: ci

# THROWAWAY experiment (never merged): screen captures around the lost clicks on the macOS runner.
# Only test fixture pages on 127.0.0.1 are on screen. No secrets.
on:
  pull_request:
    branches: [qa]

permissions:
  contents: read

jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Screen and Chrome
        run: |
          system_profiler SPDisplaysDataType || true
          "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --version || true
      - run: npm ci
      - run: npm run build
      - name: Loop mcp.int and the selftest
        run: |
          mkdir -p caps
          export CAPTURE_DIR="$PWD/caps"
          for i in $(seq 1 15); do
            export ITER=$i
            npx vitest run test/e2e/mcp.int.test.ts test/selftest/selftest.int.test.ts > "caps/$i.log" 2>&1 && r=pass || r=FAIL
            echo "iteration $i: $r"
            grep -hE "CLICK_RESULT|^ FAIL|      Tests" "caps/$i.log" | cut -c1-300 || true
            # Keep the before-click captures only for iteration 1 and for failed iterations.
            if [ "$r" = pass ] && [ "$i" != 1 ]; then rm -f caps/$i-*.png; fi
          done
          ls -la caps | grep png || echo "no captures"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: captures
          path: caps/
          retention-days: 3
