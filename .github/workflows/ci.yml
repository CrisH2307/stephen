name: ci

# docs/CI-CD-PROPOSAL.md, rollout steps 1 to 3: the full suite on Linux and macOS, and the failure report.
# No secrets, no pull_request_target, no PR text inside run:. Only the report job can write, and it runs no repo code.

on:
  pull_request:
    branches: [qa, main]
  push:
    branches: [qa]
  workflow_dispatch:

# Read-only by default. Only the report job asks for more, and only for what it writes.
permissions:
  contents: read

concurrency:
  # PRs share a group per PR (a new push cancels the old run). Each qa push gets its own group, because GitHub
  # cancels a pending run in the same group even with cancel-in-progress false.
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
            timeout: 25
          - os: macos
            runner: macos-15
            timeout: 30
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Linux tools the tests need
        if: matrix.os == 'linux'
        run: |
          command -v lsof >/dev/null && command -v ps >/dev/null || \
            { sudo apt-get update && sudo apt-get install -y lsof procps; }
      - name: Swift must exist on macOS (the Swift tests skip without it)
        if: matrix.os == 'macos'
        run: swiftc --version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/stephen-voice-test
          key: voice-models-${{ runner.os }}-${{ hashFiles('src/voice/models.ts', 'src/voice/tts/kokoro.ts') }}
      - run: npm ci
      - run: npm run build
      # macOS 14 is the minimum, and GitHub has no macOS 14 runner any more: build the helper for that target here, so an
      # API newer than macOS 14 used without #available fails CI. Runtime on macOS 14 is checked by hand.
      - name: Helper builds for the minimum macOS
        if: matrix.os == 'macos'
        run: node scripts/helper-min-macos.mjs
      - run: npm run typecheck
      # The github-actions reporter writes passed, failed and skipped counts to the job summary.
      - name: Tests
        run: npx vitest run --reporter=default --reporter=github-actions --reporter=json --outputFile.json=vitest.json
      - name: Failure report
        if: always()
        # matrix.os is a fixed value from this file, not PR text.
        run: '{ echo "### ${{ matrix.os }}"; node scripts/ci-report.mjs vitest.json; echo; } > report-${{ matrix.os }}.md'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: report-${{ matrix.os }}
          path: report-${{ matrix.os }}.md
          retention-days: 7

  # Runs no repository code: it only posts the report files the test jobs wrote.
  report:
    needs: test
    if: failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR: ${{ github.event.pull_request.number }}
      SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: report-*
          merge-multiple: true
      - name: Build the message
        run: |
          { echo "CI failed on \`$SHA\`. Run: $RUN_URL"; echo
            cat report-*.md 2>/dev/null || echo "No report file: the jobs stopped before the tests ran."
            echo; echo "Flaky? Rerun the file alone, record both results on #109. Do not just press Re-run."
          } > message.md
      # Fork and Dependabot PRs get a read-only token, so their report stays in the run summary.
      - name: Comment on the PR (branches of this repository only)
        if: github.event_name == 'pull_request' && env.SAME_REPO == 'true' && github.actor != 'dependabot[bot]'
        run: gh pr comment "$PR" --body-file message.md
      - name: Open or update the ci-failure issue (qa only)
        if: github.event_name == 'push'
        run: |
          n=$(gh issue list --label ci-failure --state open --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body-file message.md
          else gh issue create --title "CI failed on qa" --label ci-failure --body-file message.md; fi
