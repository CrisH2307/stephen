name: ci

# Rollout step 1 of docs/CI-CD-PROPOSAL.md: the linux job only.
# No secrets, no write permission, no pull_request_target, no PR text inside run:.

on:
  pull_request:
    branches: [qa, main]
  push:
    branches: [qa]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PRs share a group per PR (a new push cancels the old run). Each qa push gets its own group, because GitHub
  # cancels a pending run in the same group even with cancel-in-progress false.
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Linux tools the tests need
        run: |
          command -v lsof >/dev/null && command -v ps >/dev/null || \
            { sudo apt-get update && sudo apt-get install -y lsof procps; }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/stephen-voice-test
          key: voice-models-${{ runner.os }}-${{ hashFiles('src/voice/models.ts', 'src/voice/tts/kokoro.ts') }}
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      # The github-actions reporter writes passed, failed and skipped counts to the job summary.
      - name: Tests
        run: npx vitest run --reporter=default --reporter=github-actions
