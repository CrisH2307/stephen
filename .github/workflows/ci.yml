name: ci

# THROWAWAY experiment (never merged): why the selftest checkbox click fails on the macOS runner.
on:
  pull_request:
    branches: [qa]

permissions:
  contents: read

jobs:
  exp:
    strategy:
      fail-fast: false
      matrix:
        args:
          - ''
          - '--disable-backgrounding-occluded-windows'
          - '--disable-backgrounding-occluded-windows --disable-renderer-backgrounding --disable-background-timer-throttling'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Screen
        run: system_profiler SPDisplaysDataType | grep -iE "resolution|display type|online" || true
      - run: npm ci
      - run: npm run build
      - name: Selftest
        env:
          EXP_ARGS: ${{ matrix.args }}
        run: npx vitest run test/selftest/selftest.int.test.ts 2>&1 | grep -E "checkbox|PNG|Tests |✓|×" || true
