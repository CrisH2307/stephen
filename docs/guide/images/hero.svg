<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d">
  <title id="t">Stephen: talk to your Mac. It asks before anything risky.</title>
  <desc id="d">A drawing of the Stephen Ask box under the Mac menu bar. You say "Hey Stephen, open YouTube" and Stephen answers. A second card shows Stephen asking before it clicks a button, with Deny and Allow.</desc>
  <style>
    .head { font-family: "Avenir Next", Avenir, -apple-system, "Helvetica Neue", Arial, sans-serif; font-weight: 700; fill: #15151A; }
    .body { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; fill: #15151A; }
    .soft { fill: #4A4A57; }
    .edge { stroke: #15151A; stroke-width: 2; }
    .pulse { transform-origin: 704px 34px; animation: pulse 1.6s ease-in-out infinite; }
    .pop { animation: pop 6s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(1.5); } }
    @keyframes pop { 0%, 40% { opacity: 0; transform: translateY(8px); } 50%, 92% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(8px); } }
    @media (prefers-reduced-motion: reduce) { .pulse, .pop { animation: none; opacity: 1; transform: none; } }
  </style>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="1.2" fill="#E2DBC9"/>
    </pattern>
  </defs>

  <!-- paper -->
  <rect width="960" height="440" rx="24" fill="#FBF8F1"/>
  <rect width="960" height="440" rx="24" fill="url(#dots)"/>

  <!-- left: words -->
  <g transform="translate(48 0)">
    <rect x="0" y="64" width="40" height="40" rx="11" fill="#FFD84D" class="edge"/>
    <circle cx="20" cy="84" r="7.5" fill="none" stroke="#15151A" stroke-width="2.6"/>
    <text x="54" y="93" class="head" font-size="26">Stephen</text>
    <text x="0" y="170" class="head" font-size="42">Talk to your Mac.</text>
        <text x="0" y="232" class="head" font-size="42">It asks before</text>
    <rect x="190" y="252" width="132" height="48" rx="8" fill="#FFD84D"/>
    <text x="0" y="288" class="head" font-size="42">anything</text>
    <text x="198" y="288" class="head" font-size="42">risky.</text>
    <text x="0" y="334" class="body soft" font-size="18">A voice and browser helper for your Mac.</text>
    <text x="0" y="360" class="body soft" font-size="18">The AI behind it is Claude, on your own plan.</text>
  </g>

  <!-- right: Mac menu bar strip -->
  <g>
    <rect x="520" y="16" width="408" height="36" rx="10" fill="#FFFFFF" class="edge"/>
    <text x="538" y="40" class="body" font-size="14" font-weight="600">Zen</text>
    <text x="574" y="40" class="body soft" font-size="14">File   Edit   View</text>
    <circle cx="704" cy="34" r="6" fill="#2E9E5B" class="pulse"/>
    <text x="718" y="39" class="body soft" font-size="12">listening</text>
    <text x="880" y="40" class="body soft" font-size="13">9:41</text>
  </g>

  <!-- Ask box -->
  <g>
    <path d="M704 52 l-9 12 h18 z" fill="#FFFFFF" class="edge"/>
    <rect x="574" y="70" width="320" height="196" rx="18" fill="#15151A"/>
    <rect x="568" y="64" width="320" height="196" rx="18" fill="#FFFFFF" class="edge"/>
    <text x="588" y="94" class="head" font-size="15">Ask Stephen</text>
    <text x="812" y="94" class="body soft" font-size="12">hold F5</text>
    <!-- you -->
    <rect x="660" y="110" width="210" height="40" rx="14" fill="#E7E1FF" class="edge"/>
    <text x="676" y="135" class="body" font-size="14">Hey Stephen, open YouTube</text>
    <!-- Stephen -->
    <rect x="586" y="162" width="200" height="40" rx="14" fill="#D9ECFF" class="edge"/>
    <text x="602" y="187" class="body" font-size="14">Opened YouTube in Zen.</text>
    <!-- input -->
    <rect x="586" y="214" width="284" height="32" rx="16" fill="#FBF8F1" class="edge"/>
    <text x="602" y="235" class="body soft" font-size="13">Type or hold F5 to talk</text>
  </g>

  <!-- Allow / Deny card -->
  <g class="pop">
    <rect x="532" y="262" width="340" height="152" rx="18" fill="#15151A"/>
    <rect x="526" y="256" width="340" height="152" rx="18" fill="#FFFFFF" class="edge"/>
    <rect x="526" y="256" width="340" height="36" rx="18" fill="#FFE0E8"/>
    <rect x="526" y="274" width="340" height="18" fill="#FFE0E8"/>
    <line x1="526" y1="292" x2="866" y2="292" stroke="#15151A" stroke-width="2"/>
    <rect x="526" y="256" width="340" height="152" rx="18" fill="none" class="edge"/>
    <text x="544" y="280" class="head" font-size="13">example.com: Stephen wants to click a button</text>
    <text x="544" y="316" class="body soft" font-size="13">Button: "Send"</text>
    <text x="544" y="338" class="body soft" font-size="13">Claude says (unverified): send the reply you wrote</text>
    <!-- Deny first, Allow second -->
    <rect x="652" y="358" width="92" height="34" rx="17" fill="#FFFFFF" class="edge"/>
    <text x="698" y="380" class="body" font-size="14" font-weight="600" text-anchor="middle">Deny</text>
    <rect x="756" y="358" width="92" height="34" rx="17" fill="#1F4FC4" class="edge"/>
    <text x="802" y="380" class="body" font-size="14" font-weight="600" text-anchor="middle" fill="#FFFFFF">Allow</text>
  </g>
</svg>
