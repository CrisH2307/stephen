<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="cc-title cc-desc">
  <title id="cc-title">Stephen confirm card with Deny and Allow</title>
  <desc id="cc-desc">A confirm card asks: shop.example: Stephen wants to click a button. It lists the site, the action, why Stephen asks, what Claude says (unverified), and what the page says (unverified). Deny is the first button, Allow the second. Five numbered callouts explain each part, and that no answer in 2 minutes counts as Deny.</desc>
  <style>
    .h { font-family: "Avenir Next", Avenir, -apple-system, "Helvetica Neue", Arial, sans-serif; font-weight: 700; fill: #15151A; }
    .b { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; fill: #15151A; }
    .s { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; fill: #4A4A57; }
    .n { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; font-weight: 700; fill: #15151A; font-size: 15px; }
    .bd { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; font-weight: 700; fill: #15151A; }
    .btn { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 16px; }
  </style>
  <rect width="900" height="560" fill="#FBF8F1"/>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="1.2" fill="#E2DBC9"/>
    </pattern>
  </defs>
  <rect width="900" height="560" fill="url(#dots)"/>

  <text class="h" x="40" y="44" font-size="22">Allow or Deny</text>

  <!-- Card with hard shadow -->
  <rect x="114" y="84" width="500" height="440" rx="18" fill="#15151A"/>
  <rect x="110" y="80" width="500" height="440" rx="18" fill="#FFFFFF" stroke="#15151A" stroke-width="2"/>

  <text class="bd" x="130" y="120" font-size="16">shop.example: Stephen wants to click a button</text>
  <line x1="130" y1="136" x2="590" y2="136" stroke="#E2DBC9" stroke-width="2"/>

  <text class="b" x="130" y="168" font-size="14"><tspan class="bd">Site:</tspan> https://shop.example</text>
  <text class="b" x="130" y="198" font-size="14"><tspan class="bd">Action:</tspan> click a button</text>
  <text class="b" x="130" y="228" font-size="14"><tspan class="bd">Why you are asked:</tspan> this button may buy, send or delete</text>
  <text class="b" x="130" y="262" font-size="14"><tspan class="bd">Claude says (unverified):</tspan> place the order you asked for</text>

  <text class="bd" x="130" y="300" font-size="14">Page says (unverified):</text>
  <rect x="130" y="310" width="460" height="40" rx="10" fill="#FFE0E8" stroke="#15151A" stroke-width="1.5"/>
  <text class="b" x="144" y="335" font-size="14">Element label: Buy now</text>

  <!-- Buttons: Deny first, Allow second -->
  <rect x="382" y="420" width="100" height="40" rx="12" fill="#15151A"/>
  <rect x="378" y="416" width="100" height="40" rx="12" fill="#FFFFFF" stroke="#15151A" stroke-width="2"/>
  <text class="btn" x="428" y="442" text-anchor="middle" fill="#15151A">Deny</text>

  <rect x="498" y="420" width="100" height="40" rx="12" fill="#15151A"/>
  <rect x="494" y="416" width="100" height="40" rx="12" fill="#1F4FC4" stroke="#15151A" stroke-width="2"/>
  <text class="btn" x="544" y="442" text-anchor="middle" fill="#FFFFFF">Allow</text>

  <!-- Callouts on the card -->
  <circle cx="84" cy="120" r="14" fill="#FFD84D" stroke="#15151A" stroke-width="2"/>
  <text class="n" x="84" y="125" text-anchor="middle">1</text>
  <circle cx="84" cy="182" r="14" fill="#FFD84D" stroke="#15151A" stroke-width="2"/>
  <text class="n" x="84" y="187" text-anchor="middle">2</text>
  <circle cx="84" cy="258" r="14" fill="#FFD84D" stroke="#15151A" stroke-width="2"/>
  <text class="n" x="84" y="263" text-anchor="middle">3</text>
  <circle cx="84" cy="330" r="14" fill="#FFD84D" stroke="#15151A" stroke-width="2"/>
  <text class="n" x="84" y="335" text-anchor="middle">4</text>
  <circle cx="352" cy="436" r="14" fill="#FFD84D" stroke="#15151A" stroke-width="2"/>
  <text class="n" x="352" y="441" text-anchor="middle">5</text>

  <!-- Legend (right) -->
  <text class="h" x="640" y="112" font-size="16">What each number means</text>
  <line x1="640" y1="124" x2="890" y2="124" stroke="#E2DBC9" stroke-width="2"/>

  <circle cx="652" cy="142" r="14" fill="#FFD84D" stroke="#15151A" stroke-width="2"/>
  <text class="n" x="652" y="147" text-anchor="middle">1</text>
  <text class="s" x="674" y="146" font-size="14">Who wants to act</text>
  <text class="s" x="674" y="164" font-size="14">and on which site.</text>

  <circle cx="652" cy="210" r="14" fill="#FFD84D" stroke="#15151A" stroke-width="2"/>
  <text class="n" x="652" y="215" text-anchor="middle">2</text>
  <text class="s" x="674" y="214" font-size="14">Facts Stephen checked</text>
  <text class="s" x="674" y="232" font-size="14">itself: the site, the</text>
  <text class="s" x="674" y="250" font-size="14">action and why it asks.</text>

  <circle cx="652" cy="292" r="14" fill="#FFD84D" stroke="#15151A" stroke-width="2"/>
  <text class="n" x="652" y="297" text-anchor="middle">3</text>
  <text class="s" x="674" y="296" font-size="14">What Claude says.</text>
  <text class="s" x="674" y="314" font-size="14">It may be wrong.</text>

  <circle cx="652" cy="346" r="14" fill="#FFD84D" stroke="#15151A" stroke-width="2"/>
  <text class="n" x="652" y="351" text-anchor="middle">4</text>
  <text class="s" x="674" y="350" font-size="14">What the page says.</text>
  <text class="s" x="674" y="368" font-size="14">It may lie.</text>

  <circle cx="652" cy="400" r="14" fill="#FFD84D" stroke="#15151A" stroke-width="2"/>
  <text class="n" x="652" y="405" text-anchor="middle">5</text>
  <text class="s" x="674" y="404" font-size="14">Deny is always safe.</text>
  <text class="s" x="674" y="422" font-size="14">No answer in 2 minutes</text>
  <text class="s" x="674" y="440" font-size="14">counts as Deny.</text>
</svg>
