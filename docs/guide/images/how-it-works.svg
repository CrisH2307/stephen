<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="hiw-t hiw-d">
  <title id="hiw-t">How Stephen works</title>
  <desc id="hiw-d">Five steps. You talk. Your Mac writes it down. Claude plans the steps on your own Claude plan, outside your Mac. The safety gate checks each step and does it, asks you, or refuses. Your browser does the step. Only text goes out to Claude.</desc>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#E2DBC9"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#15151A"/>
    </marker>
  </defs>
  <style>
    .h { font-family: "Avenir Next", Avenir, -apple-system, "Helvetica Neue", Arial, sans-serif; font-weight: 700; fill: #15151A; }
    .b { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #15151A; }
    .d { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; font-size: 13px; fill: #4A4A57; }
    .t { font-family: "Avenir Next", Avenir, -apple-system, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 16px; fill: #15151A; }
    .n { font-family: "Avenir Next", Avenir, -apple-system, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 15px; fill: #FFFFFF; text-anchor: middle; }
    .p { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 13px; fill: #15151A; text-anchor: middle; }
    .c1 { animation: hl 8s ease-in-out infinite; }
    .c2 { animation: hl 8s ease-in-out 1.6s infinite; }
    .c3 { animation: hl 8s ease-in-out 3.2s infinite; }
    .c4 { animation: hl 8s ease-in-out 4.8s infinite; }
    .c5 { animation: hl 8s ease-in-out 6.4s infinite; }
    .dot { animation: go 8s ease-in-out infinite; }
    @keyframes hl {
      0%, 10% { fill: #FFD84D; }
      20%, 100% { fill: #FFFFFF; }
    }
    @keyframes go {
      0%, 10% { transform: translateX(0px); opacity: 1; }
      20%, 30% { transform: translateX(182px); opacity: 1; }
      40%, 50% { transform: translateX(364px); opacity: 1; }
      60%, 70% { transform: translateX(546px); opacity: 1; }
      80%, 90% { transform: translateX(728px); opacity: 1; }
      94%, 100% { transform: translateX(728px); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>

  <rect width="960" height="420" fill="#FBF8F1"/>
  <rect width="960" height="420" fill="url(#dots)"/>

  <text class="h" x="34" y="34" font-size="20">How a request moves</text>

  <!-- Your Mac boundaries (steps 1, 2, 4, 5) -->
  <rect x="16" y="50" width="373" height="344" rx="22" fill="none" stroke="#15151A" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="571" y="50" width="373" height="344" rx="22" fill="none" stroke="#15151A" stroke-width="2" stroke-dasharray="8 6"/>
  <text class="b" x="34" y="74">Your Mac</text>
  <text class="b" x="589" y="74">Your Mac</text>

  <!-- Dot track -->
  <line x1="116" y1="96" x2="844" y2="96" stroke="#4A4A57" stroke-width="2" stroke-dasharray="4 6"/>
  <circle class="dot" cx="116" cy="96" r="7" fill="#FFD84D" stroke="#15151A" stroke-width="2"/>

  <!-- Arrows between cards -->
  <line x1="201" y1="243" x2="213" y2="243" stroke="#15151A" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="383" y1="243" x2="395" y2="243" stroke="#15151A" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="565" y1="243" x2="577" y2="243" stroke="#15151A" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="747" y1="243" x2="759" y2="243" stroke="#15151A" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Card 1: You talk -->
  <rect x="38" y="116" width="164" height="262" rx="16" fill="#15151A"/>
  <rect class="c1" x="34" y="112" width="164" height="262" rx="16" fill="#FFFFFF" stroke="#15151A" stroke-width="2"/>
  <circle cx="64" cy="142" r="14" fill="#1F4FC4" stroke="#15151A" stroke-width="2"/>
  <text class="n" x="64" y="147">1</text>
  <text class="t" x="48" y="178">You talk</text>
  <text class="d" x="48" y="228">Say "Hey Stephen"</text>
  <text class="d" x="48" y="246">or hold F5 and</text>
  <text class="d" x="48" y="264">talk.</text>

  <!-- Card 2: Your Mac writes it down -->
  <rect x="220" y="116" width="164" height="262" rx="16" fill="#15151A"/>
  <rect class="c2" x="216" y="112" width="164" height="262" rx="16" fill="#FFFFFF" stroke="#15151A" stroke-width="2"/>
  <circle cx="246" cy="142" r="14" fill="#1F4FC4" stroke="#15151A" stroke-width="2"/>
  <text class="n" x="246" y="147">2</text>
  <text class="t" x="230" y="178">Your Mac</text>
  <text class="t" x="230" y="198">writes it down</text>
  <text class="d" x="230" y="228">Speech to text</text>
  <text class="d" x="230" y="246">runs on your Mac.</text>
  <text class="d" x="230" y="264">Audio stays here.</text>

  <!-- Card 3: Claude plans the steps (outside your Mac) -->
  <rect x="402" y="116" width="164" height="262" rx="16" fill="#15151A"/>
  <rect class="c3" x="398" y="112" width="164" height="262" rx="16" fill="#FFFFFF" stroke="#15151A" stroke-width="2"/>
  <circle cx="428" cy="142" r="14" fill="#1F4FC4" stroke="#15151A" stroke-width="2"/>
  <text class="n" x="428" y="147">3</text>
  <text class="t" x="412" y="178">Claude plans</text>
  <text class="t" x="412" y="198">the steps</text>
  <text class="d" x="412" y="228">Runs on your own</text>
  <text class="d" x="412" y="246">Claude plan.</text>

  <rect x="398" y="384" width="164" height="24" rx="12" fill="#E7E1FF" stroke="#15151A" stroke-width="1.5"/>
  <text class="p" x="480" y="401">Only text goes out</text>

  <!-- Card 4: Safety gate -->
  <rect x="584" y="116" width="164" height="262" rx="16" fill="#15151A"/>
  <rect class="c4" x="580" y="112" width="164" height="262" rx="16" fill="#FFFFFF" stroke="#15151A" stroke-width="2"/>
  <circle cx="610" cy="142" r="14" fill="#1F4FC4" stroke="#15151A" stroke-width="2"/>
  <text class="n" x="610" y="147">4</text>
  <text class="t" x="594" y="178">Safety gate</text>
  <text class="d" x="594" y="228">Checks each step</text>
  <text class="d" x="594" y="246">in code, not AI.</text>
  <rect x="594" y="268" width="136" height="22" rx="11" fill="#D8F4E4" stroke="#15151A" stroke-width="1.5"/>
  <text class="p" x="662" y="283">Do it</text>
  <rect x="594" y="294" width="136" height="22" rx="11" fill="#FFD84D" stroke="#15151A" stroke-width="1.5"/>
  <text class="p" x="662" y="309">Ask you</text>
  <rect x="594" y="320" width="62" height="20" rx="10" fill="#FFE0E8" stroke="#15151A" stroke-width="1.5"/>
  <text class="p" x="625" y="334">Deny</text>
  <rect x="668" y="320" width="62" height="20" rx="10" fill="#D8F4E4" stroke="#15151A" stroke-width="1.5"/>
  <text class="p" x="699" y="334">Allow</text>
  <rect x="594" y="344" width="136" height="22" rx="11" fill="#FFE0E8" stroke="#15151A" stroke-width="1.5"/>
  <text class="p" x="662" y="359">Refuse</text>

  <!-- Card 5: Your browser does it -->
  <rect x="766" y="116" width="164" height="262" rx="16" fill="#15151A"/>
  <rect class="c5" x="762" y="112" width="164" height="262" rx="16" fill="#FFFFFF" stroke="#15151A" stroke-width="2"/>
  <circle cx="792" cy="142" r="14" fill="#1F4FC4" stroke="#15151A" stroke-width="2"/>
  <text class="n" x="792" y="147">5</text>
  <text class="t" x="776" y="178">Your browser</text>
  <text class="t" x="776" y="198">does it</text>
  <text class="d" x="776" y="228">Zen or Chrome.</text>
</svg>
