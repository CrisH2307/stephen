<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" width="980" height="300" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">Stephen: voice path, left to right</title>
  <desc id="d">Seven steps run left to right on the Mac and then to Claude: microphone, wake word or F5 key, voice detection, speech to text, local routers, Claude with Stephen's tools, and speech out. A dot moves along the track under the steps to show one command. The routers answer without the model. The Tier 1 and Tier 2 label is a shadow label and does not route. With reduced motion on, the dot is hidden and the diagram is still complete.</desc>
  <style>
    .bg{fill:#ffffff}
    .step{fill:#eef4fb;stroke:#2f5d8a;stroke-width:1.5}
    .model{fill:#fdf6ea;stroke:#b7791f;stroke-width:1.5}
    .h{font-size:12px;font-weight:700;fill:#1d3557}
    .s{font-size:11px;fill:#3a4256}
    .n{font-size:11px;font-weight:700;fill:#2f5d8a}
    .cap{font-size:12px;font-weight:700;fill:#2f5d8a}
    .track{stroke:#8a8fa3;stroke-width:2;stroke-dasharray:4 4;fill:none}
    .tick{stroke:#8a8fa3;stroke-width:1;stroke-dasharray:2 3}
    .a{stroke:#1d3557;stroke-width:1.6;fill:none;marker-end:url(#ar)}
    .note{fill:#ffffff;stroke:#8a8fa3;stroke-width:1;stroke-dasharray:3 4}
    .dot{fill:#b7791f}
    .pulse{animation:travel 7s linear infinite}
    @keyframes travel{from{transform:translateX(0)}to{transform:translateX(880px)}}
    @media (prefers-reduced-motion: reduce){.pulse{animation:none;opacity:0}}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0f1726}
      .step{fill:#16263d;stroke:#7fa7d1}
      .model{fill:#2b2215;stroke:#e0a84a}
      .h{fill:#e6eef8}.s{fill:#c4cede}.n{fill:#9fc0e3}.cap{fill:#9fc0e3}
      .track{stroke:#7d849b}.tick{stroke:#7d849b}
      .a{stroke:#a9c4e2}
      #ar path{fill:#a9c4e2}
      .note{fill:#0f1726;stroke:#7d849b}
      .dot{fill:#f0c37a}
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d3557"/></marker>
  </defs>
  <rect class="bg" width="980" height="300"/>

  <text class="cap" x="35" y="28">One command, on the Mac, then Claude and back</text>

  <!-- Steps: x = 35, 167, 299, 431, 563, 695, 827; width 118 -->
  <rect class="step" x="35" y="50" width="118" height="92" rx="9"/>
  <text class="n" x="44" y="68">1</text>
  <text class="h" x="44" y="86">Microphone</text>
  <text class="s" x="44" y="104">16 kHz mono</text>
  <text class="s" x="44" y="120">32 ms frames</text>

  <rect class="step" x="167" y="50" width="118" height="92" rx="9"/>
  <text class="n" x="176" y="68">2</text>
  <text class="h" x="176" y="86">Wake word</text>
  <text class="s" x="176" y="104">or F5 key</text>
  <text class="s" x="176" y="120">keyword spotter</text>

  <rect class="step" x="299" y="50" width="118" height="92" rx="9"/>
  <text class="n" x="308" y="68">3</text>
  <text class="h" x="308" y="86">Voice detection</text>
  <text class="s" x="308" y="104">Silero VAD</text>
  <text class="s" x="308" y="120">0.8 s silence ends</text>

  <rect class="step" x="431" y="50" width="118" height="92" rx="9"/>
  <text class="n" x="440" y="68">4</text>
  <text class="h" x="440" y="86">Speech to text</text>
  <text class="s" x="440" y="104">whisper-small.en</text>
  <text class="s" x="440" y="120">on the Mac</text>

  <rect class="step" x="563" y="50" width="118" height="92" rx="9"/>
  <text class="n" x="572" y="68">5</text>
  <text class="h" x="572" y="86">Local routers</text>
  <text class="s" x="572" y="104">memory, timer,</text>
  <text class="s" x="572" y="120">job, no model</text>

  <rect class="model" x="695" y="50" width="118" height="92" rx="9"/>
  <text class="n" x="704" y="68">6</text>
  <text class="h" x="704" y="86">Claude + tools</text>
  <text class="s" x="704" y="104">warm, 25 commands</text>
  <text class="s" x="704" y="120">daily USD limit</text>

  <rect class="step" x="827" y="50" width="118" height="92" rx="9"/>
  <text class="n" x="836" y="68">7</text>
  <text class="h" x="836" y="86">Speech out</text>
  <text class="s" x="836" y="104">ElevenLabs</text>
  <text class="s" x="836" y="120">then Kokoro, say</text>

  <!-- Arrows between steps -->
  <path class="a" d="M154,96 H165"/>
  <path class="a" d="M286,96 H297"/>
  <path class="a" d="M418,96 H429"/>
  <path class="a" d="M550,96 H561"/>
  <path class="a" d="M682,96 H693"/>
  <path class="a" d="M814,96 H825"/>

  <!-- Track under the steps, with ticks -->
  <path class="tick" d="M94,142 V190 M226,142 V190 M358,142 V190 M490,142 V190 M622,142 V190 M754,142 V190 M886,142 V190"/>
  <path class="track" d="M35,190 H945"/>
  <circle class="dot pulse" cx="45" cy="190" r="6"/>

  <!-- Notes -->
  <rect class="note" x="35" y="222" width="380" height="50" rx="6"/>
  <text class="s" x="47" y="240">Push to talk: hold 250 ms to 30 s. Key up ends it.</text>
  <text class="s" x="47" y="258">Wake word: the transcript must also contain the phrase.</text>

  <rect class="note" x="563" y="222" width="382" height="50" rx="6"/>
  <text class="s" x="575" y="240">Tier 1 / Tier 2: a label only (shadow mode).</text>
  <text class="s" x="575" y="258">It does not route. Routers run before the model.</text>

  <text class="s" x="35" y="292">The dot is one command moving left to right. It is hidden when reduced motion is on.</text>
</svg>
