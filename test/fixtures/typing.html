<!doctype html>
<html><head><meta charset="utf-8"><title>Typing</title></head>
<body>
<script>
  window.keys = [];
  window.submits = 0;
  document.addEventListener('keydown', (e) => window.keys.push(e.key), true);
</script>
<form id="f" onsubmit="event.preventDefault(); window.submits++">
  <label for="user">Username</label> <input id="user" name="user">
  <label for="pass">Password</label> <input id="pass" name="pass" type="password">
  <label for="repo">Repository name</label> <input id="repo">
  <label for="msg">Message</label> <textarea id="msg"></textarea>
  <button>Save</button>
</form>
<div id="chat" contenteditable="true" role="textbox" aria-label="Chat message"
     onkeydown="if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); window.sent = (window.sent || 0) + 1; }"></div>
<label for="jumpy">Jumpy</label> <textarea id="jumpy"></textarea>
<label for="other">Other field</label> <input id="other">
<label for="slow">Slow</label> <textarea id="slow"></textarea>
<label for="email">Email</label> <input id="email" type="email" value="ada">
<label for="when">Date</label> <input id="when" type="date">
<label for="qty">Quantity</label> <input id="qty" type="number" value="1">
<script>
  // Moves focus away after the first insertion (autocomplete popups, hostile pages…).
  document.getElementById('jumpy').addEventListener('input', () => document.getElementById('other').focus());
  // Blocks the page's main thread for 17 s right after the first insertion.
  document.getElementById('slow').addEventListener('input', () => {
    if (window.blocked) return;
    window.blocked = true;
    setTimeout(() => { const end = Date.now() + 17000; while (Date.now() < end) {} }, 0);
  });
</script>
</body></html>
