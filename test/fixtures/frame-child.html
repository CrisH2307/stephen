<!doctype html>
<html><head><meta charset="utf-8"><title>Child</title></head>
<body>
<p>Same-origin child frame text</p>
<button id="childbtn" onclick="document.body.dataset.clicked='yes'; document.getElementById('out').textContent='child clicked'">Child button</button>
<input id="childinput" aria-label="Child input">
<div id="out"></div>
</body></html>
