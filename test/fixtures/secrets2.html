<!doctype html>
<html><head><meta charset="utf-8"><title>Sign in</title>
<style>input { width: 160px; } .box { width: 32px; }</style>
</head>
<body>
<main>
<!-- Review #2 finding 10: secret fields the attribute rules miss (from the reviewer's p3-secrets.mjs) -->
<form id="f" onsubmit="return false">
  <p><div>Password</div><input id="masked" style="-webkit-text-security:disc"></p>
  <p><div class="lbl">Password</div><input id="siblbl" class="pw-field"></p>
  <p><label>Enter the 6-digit code we texted you <input id="otp6" name="code" inputmode="numeric"></label></p>
  <p><input id="digit1" maxlength="1" inputmode="numeric" aria-label="Digit 1 of 6"></p>
  <p><label>Card <input id="card" inputmode="numeric" placeholder="1234 1234 1234 1234"></label></p>
  <p><label>Code <input id="shortcode" inputmode="numeric" maxlength="6"></label></p>
  <fieldset id="split"><legend>Verify it's you</legend>
    <div><input class="box" id="b1" maxlength="1"></div><div><input class="box" id="b2" maxlength="1"></div>
    <div><input class="box" id="b3" maxlength="1"></div><div><input class="box" id="b4" maxlength="1"></div>
    <div><input class="box" id="b5" maxlength="1"></div><div><input class="box" id="b6" maxlength="1"></div>
  </fieldset>
  <!-- controls: ordinary fields that must stay typeable -->
  <p><label>Nickname <input id="nick"></label></p>
  <p><label>ZIP code <input id="zip" inputmode="numeric" maxlength="5"></label></p>
  <p><label>Promo code <input id="promo" inputmode="numeric" maxlength="6"></label></p>
  <p><label>Quantity <input id="qty" inputmode="numeric" maxlength="3"></label></p>
  <p><label>We will text a 6-digit code to this number <input id="phone" name="phone" type="tel"></label></p>
  <p><div>Display name</div><input id="disp"></p>
  <p><label>Middle initial <input id="mi" maxlength="1"></label></p>
</form>

<!-- Review #2 finding 13: fields that turn secret only once focused -->
<form id="g" onsubmit="return false">
  <p><label>Nickname two <input id="sw"></label></p>
  <div id="ce" contenteditable="true" role="textbox" aria-label="Comment" style="min-height:30px;border:1px solid">
    <input id="inner" type="password" aria-label="x" style="width:80px">
  </div>
  <p><label>Alias <input id="mask-on-focus"></label></p>
  <p><label>Notes <textarea id="late"></textarea></label></p>
  <p><label>Plain <input id="plain"></label></p>
</form>
<button id="btn">Just a button</button>
</main>
<script>
document.getElementById('sw').addEventListener('focus', (e) => { e.target.type = 'password'; });
document.getElementById('ce').addEventListener('focus', () => document.getElementById('inner').focus());
document.getElementById('mask-on-focus').addEventListener('focus', (e) => { e.target.style.webkitTextSecurity = 'disc'; });
// Turns into a masked field after the first input event (between typing chunks).
document.getElementById('late').addEventListener('input', (e) => { e.target.style.webkitTextSecurity = 'disc'; });
</script>
</body></html>
