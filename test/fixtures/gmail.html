<!doctype html>
<html><head><meta charset="utf-8"><title>Inbox (3) – Mail</title>
<style>
  body { margin: 0; font-family: sans-serif; }
  .btn { display: inline-block; padding: 8px 16px; cursor: pointer; background: #c2e7ff; }
  .row { cursor: pointer; padding: 4px; border-bottom: 1px solid #ddd; }
  #composer { min-height: 80px; border: 1px solid #999; padding: 4px; }
</style></head>
<body>
<header role="banner"><div role="search"><input id="q" aria-label="Search mail" placeholder="Search mail"></div></header>
<div role="navigation" aria-label="Mail folders">
  <div class="btn" role="button" tabindex="0" id="compose" onclick="document.getElementById('dialog').hidden=false">Compose</div>
  <a href="#inbox" id="inbox">Inbox <span>3</span></a>
  <a href="#sent">Sent</a>
</div>
<div role="main">
  <div class="row" jsaction="click:openThread" id="row1"><span>Alice</span> — <span>Lunch on Friday?</span></div>
  <div class="row" tabindex="0" id="row2"><span>Bob</span> — <span>Quarterly report</span></div>
  <div id="clicky" onclick="this.dataset.clicked='yes'">Archive all</div>
  <x-toolbar id="tb"></x-toolbar>
</div>
<div role="dialog" aria-label="New Message" id="dialog" hidden>
  <input id="to" aria-label="To recipients">
  <div id="composer" contenteditable="true" role="textbox" aria-label="Message Body"></div>
  <div class="btn" role="button" tabindex="0" id="send" onclick="document.title='sent:'+document.getElementById('composer').innerText">Send</div>
</div>
<script>
  customElements.define('x-toolbar', class extends HTMLElement {
    constructor() {
      super();
      const root = this.attachShadow({ mode: 'open' });
      root.innerHTML = '<nav aria-label="Toolbar"><button id="shadowbtn">Mark as read</button><slot></slot></nav>';
      root.getElementById('shadowbtn').addEventListener('click', () => { document.body.dataset.marked = 'yes'; });
    }
  });
</script>
</body></html>
